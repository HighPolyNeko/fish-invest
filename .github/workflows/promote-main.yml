name: Promote main

# main догоняет коммит релиза (только fast-forward) и получает тег с номером релиза.
# Автоматически: когда в develop смержен back-merge PR из release/**.
# Вручную: workflow_dispatch с именем релизной ветки.
#
# Используется pull_request_target, чтобы workflow брался из develop (а не из ветки PR)
# и секрет DEPLOY_KEY из environment "release" был доступен только ветке develop.
# Код из PR здесь не выполняется и не выкачивается: берётся только sha коммита.
on:
  pull_request_target:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Релизная ветка, например release/1.4.2'
        required: true

permissions:
  contents: read

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Fast-forward main
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ inputs.release_branch }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$MANUAL_BRANCH" in
              release/*) ;;
              *) echo "Нужна ветка вида release/X.Y.Z"; exit 1 ;;
            esac
            TARGET="origin/$MANUAL_BRANCH"
          else
            # ветку могли удалить при мерже, поэтому берём коммит, а не имя
            echo "Back-merge из $PR_HEAD_REF"
            RELEASE_BRANCH="$PR_HEAD_REF"
            TARGET="$PR_HEAD_SHA"
          fi
          RELEASE_BRANCH="${RELEASE_BRANCH:-$MANUAL_BRANCH}"
          TAG="${RELEASE_BRANCH#release/}"
          SHA=$(git rev-parse "$TARGET^{commit}")

          git merge --ff-only "$TARGET"
          git push origin main

          # тег = имя релизной ветки без release/ (release/0.0.1-test -> 0.0.1-test)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ]; then
              echo "Тег $TAG уже стоит на этом коммите"
              exit 0
            fi
            echo "Тег $TAG уже существует на другом коммите"
            exit 1
          fi
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
