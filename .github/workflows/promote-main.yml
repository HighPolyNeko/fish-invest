name: Promote main

# main догоняет коммит релиза (только fast-forward), получает тег с номером релиза,
# после чего релизная ветка удаляется.
# Автоматически: когда в develop смержен back-merge PR из release/**.
# Вручную: workflow_dispatch с именем релизной ветки.
#
# Используется pull_request_target, чтобы workflow брался из develop (а не из ветки PR)
# и секрет DEPLOY_KEY из environment "release" был доступен только ветке develop.
# Код из PR здесь не выполняется и не выкачивается: берётся только sha коммита.
on:
  pull_request_target:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Релиз: 0.2.0 или release/0.2.0 (ветка будет удалена после выкатки)'
        required: true

permissions:
  contents: read

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Fast-forward main
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ inputs.release_branch }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # можно ввести и 0.2.0, и release/0.2.0
            RELEASE_BRANCH="release/${MANUAL_BRANCH#release/}"
            if [ "$RELEASE_BRANCH" = "release/" ]; then echo "Укажи релиз, например 0.2.0"; exit 1; fi
            git rev-parse -q --verify "origin/$RELEASE_BRANCH" >/dev/null \
              || { echo "Ветки $RELEASE_BRANCH нет в репозитории"; exit 1; }
            TARGET="origin/$RELEASE_BRANCH"
          else
            # ветку могли удалить при мерже, поэтому берём коммит, а не имя
            echo "Back-merge из $PR_HEAD_REF"
            RELEASE_BRANCH="$PR_HEAD_REF"
            TARGET="$PR_HEAD_SHA"
          fi
          TAG="${RELEASE_BRANCH#release/}"
          SHA=$(git rev-parse "$TARGET^{commit}")

          git merge --ff-only "$TARGET"
          git push origin main

          # тег = имя релизной ветки без release/ (release/0.0.1-test -> 0.0.1-test)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$SHA" ]; then
              echo "Тег $TAG уже существует на другом коммите"
              exit 1
            fi
            echo "Тег $TAG уже стоит на этом коммите"
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

          # релиз выкачен и помечен тегом, ветка больше не нужна
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            git push origin --delete "$RELEASE_BRANCH" \
              || echo "::warning::Не удалось удалить ветку $RELEASE_BRANCH, удали её вручную"
          else
            echo "Ветка $RELEASE_BRANCH уже удалена"
          fi
