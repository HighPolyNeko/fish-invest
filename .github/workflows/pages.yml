name: Pages

# Публикация main на GitHub Pages: index.html, css/, js/, assets/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html css js assets data _site/
          # версия в адресах файлов (?v=<коммит>): после каждого деплоя браузер берёт свежие файлы,
          # а не старые из кеша. Меняется только копия в _site, исходный index.html остаётся как есть.
          VER="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((css|js|data|assets)/[^\"]+)\"#\1=\"\2?v=${VER}\"#g" _site/index.html
          echo "Версия файлов: ${VER}"
          grep -c "?v=${VER}" _site/index.html
          # ни одной ссылки без версии остаться не должно
          if grep -E "(src|href)=\"(css|js|data|assets)/[^\"?]+\"" _site/index.html; then
            echo "Остались адреса без версии"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
